name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.workspace.path }}, ${{ matrix.bazel.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - { path: ., slug: root }
          - { path: e2e/smoke, slug: e2e-smoke }
        bazel:
          # 8.6.0 is the minimum supported version; 9.x is the latest Bazel 9 release.
          - { id: bazel-8, version: 8.6.0 }
          - { id: bazel-9, version: 9.x }
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.workspace.slug }}-${{ matrix.bazel.id }}
          repository-cache: true

      # Exit code 4 means the build succeeded but the folder has no test targets.
      - name: bazel test //...
        working-directory: ${{ matrix.workspace.path }}
        run: bazel --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc test //... || test $? -eq 4

  # For branch protection settings, this job provides a "stable" name that can be used to gate PR merges
  # on "all matrix jobs were successful".
  conclusion:
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            exit 0
          else
            exit 1
          fi
